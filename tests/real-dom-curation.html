<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>curation fixture</title>
<style>
  body { font: 13px system-ui; margin: 0; background: #121212; color: #fff; }
  #out { white-space: pre-wrap; font: 12px ui-monospace, monospace; padding: 12px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; height: 90px; background: #000;
           display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  [data-testid="now-playing-widget"] { display: flex; align-items: center; gap: 8px; }
  [data-encore-id="listRow"] { display: flex; align-items: center; gap: 8px; }
  img[data-testid="entity-image"] { width: 32px; height: 32px; }
  #curation-sheet-list { max-height: 420px; overflow: auto; }
</style>
</head>
<body>
<pre id="out">running</pre>

<!-- ============ Player bar (minimal, for scoping findCurationButton) ======== -->
<footer data-testid="now-playing-bar">
  <div data-testid="now-playing-widget">
    <img data-testid="cover-art-image" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    <a href="/track/abc123">Real Track</a>

    <!-- VERBATIM from the report: the heart button -->
    <button aria-checked="false" class="e-10860-legacy-button e-10860-legacy-button-tertiary e-10860-overflow-wrap-anywhere e-10860-button-tertiary--icon-only-small e-10860-button-tertiary--icon-only e-10860-button-tertiary--condensed e-10860-button-tertiary--text-subdued encore-internal-color-text-subdued" aria-label="Add to Liked Songs" data-encore-id="buttonTertiary" aria-expanded="false"><span aria-hidden="true" class="e-10860-button__icon-wrapper"><svg data-encore-id="icon" role="img" aria-hidden="true" class="e-10860-icon" viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8"></path><path d="M11.75 8a.75.75 0 0 1-.75.75H8.75V11a.75.75 0 0 1-1.5 0V8.75H5a.75.75 0 0 1 0-1.5h2.25V5a.75.75 0 0 1 1.5 0v2.25H11a.75.75 0 0 1 .75.75"></path></svg></span></button>
  </div>
  <button data-testid="control-button-playpause" aria-label="Pause">||</button>
  <button data-testid="add-button" aria-label="Add to Liked Songs" aria-checked="false">+</button>
</footer>

<script src="../spotifyAdapter.js"></script>
<script>
/* Rows use the EXACT shape pasted from the report: the <button> carries NO
 * aria-labelledby — listrow-title-<uri> hangs off the inner
 * div[data-encore-id="listRow"][role="group"], and the title <p> carries the id. */
var LIKED_URI = "spotify:collection:tracks";
var PLAYLISTS = [
  ["spotify:playlist:1w4tj8rQmdzeNmV7JzCbeE", "web swinging in nyc", "https://image-cdn-ak.spotifycdn.com/image/ab67706c0000dec505176066249626d28081f6f1"],
  ["spotify:playlist:4zZa7QE5aV82huyDbtR8En", "IX \u00b7 MMXXVI",  "https://mosaic.scdn.co/60/ab67616d00001e023"],
  ["spotify:playlist:0GSoubNd1aMs7hJjdedYcf", "VI \u00b7 MMXXVI",  "https://mosaic.scdn.co/60/ab67616d00001e020"],
  ["spotify:playlist:4SX1HQaUaInlyuZWP3Q7j7", "V \u00b7 MMXXVI",   "https://mosaic.scdn.co/60/ab67616d00001e022"],
  ["spotify:playlist:00w41uqROQymsUsla3Vk63", "IV \u00b7 MMXXVI",  "https://mosaic.scdn.co/60/ab67616d00001e021"],
  ["spotify:playlist:6rfoNwFpRr2uJ5MGlXfaxY", "My playlist #9",    "https://i.scdn.co/image/ab67616d000011eb350ab7a839c04bfd5225a9f5"],
  ["spotify:playlist:5xOYHulYoliZZLm5LktVFz", "pothos \ud83c\udf3f", "https://image-cdn-ak.spotifycdn.com/image/ab67706c0000dec559368ba122ca56ef543c3f5d"],
  ["spotify:playlist:5GNcNNXQj70EtIMjBcNDwz", "twinning",          "https://image-cdn-ak.spotifycdn.com/image/ab67706c0000dec5413d31f468a6e1ca6d358185"],
  ["spotify:playlist:5Puf1110c0MI151l0d8yym", "chillin",           "https://image-cdn-ak.spotifycdn.com/image/ab67706c0000dec531746559fea7f04d4db126a3"],
  ["spotify:playlist:3NjjFdOp2vdE61W09T3OOP", "mandys playlist",   "https://i.scdn.co/image/ab67616d000011eb2bf0876d42b90a8852ad6244"],
  ["spotify:playlist:6wxY1w7dYQUOC5M9vsgjuR", "feelin good",       "https://image-cdn-ak.spotifycdn.com/image/ab67706c0000dec5d9bc0b2d6b03d37169153536"],
  ["spotify:playlist:4Iw2bmBCgRvd4lZjdkRo7d", "Doggo-melon",       "https://image-cdn-fa.spotifycdn.com/image/ab67706c0000dec52766a254646c0f5cf26533ec"],
  ["spotify:playlist:36LGUWbBkU0W9Cdaahqdq8", "Mood",              "https://mosaic.scdn.co/60/ab67616d00001e024"],
];

// Server-side truth the sheet renders from and Done commits back into.
var membership = {};
var liked = false;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function rowHtml(uri, name, art, pos, setsize) {
  var checked = uri === LIKED_URI ? liked : !!membership[uri];
  var srcset = art.indexOf("/60/") !== -1
    ? ' srcset="' + art + '30w, ' + art + '60w"' : "";
  return (
    '<li role="presentation" data-depth="0">' +
      '<button class="QpDFZgzjNoy0kJn5o07g" as="button" role="menuitemcheckbox"' +
        ' aria-checked="' + (checked ? "true" : "false") + '"' +
        ' aria-setsize="' + setsize + '" aria-posinset="' + pos + '" tabindex="-1">' +
        '<div class="e-10860-legacy-box e-10860-legacy-list-row e-10860-legacy-list-row--has-leading hnQlCE5KACNpzl2hNDUg"' +
          ' data-encore-id="listRow" role="group" aria-labelledby="listrow-title-' + uri + '">' +
          '<div class="e-10860-legacy-list-row__header-side"><div class="e-10860-legacy-list-row__header-side-flex">' +
            '<div style="width:32px;height:32px"><img aria-hidden="true" draggable="false" loading="eager"' +
            ' src="' + art + '"' + srcset + ' data-image-status="loaded" data-testid="entity-image" alt="' + esc(name) + '"></div>' +
          '</div></div>' +
          '<div class="e-10860-legacy-list-row__header"><div class="e-10860-legacy-list-row__column e-10860-legacy-list-row__interactive">' +
            '<p class="e-10860-text encore-text-body-medium e-10860-legacy-list-row-title e-10860-overflow-wrap-anywhere"' +
            ' data-encore-id="listRowTitle" id="listrow-title-' + uri + '" aria-hidden="true" dir="auto">' +
              '<span class="e-10860-line-clamp" style="--encore-line-clamp: 1;">' + esc(name) + '</span>' +
            '</p>' +
          '</div></div>' +
        '</div>' +
      '</button>' +
    '</li>'
  );
}

function buildFormHTML() {
  var setsize = PLAYLISTS.length + 2;   // + New playlist + Liked Songs
  var rows =
    '<li role="presentation" data-depth="0">' +
      '<button class="QpDFZgzjNoy0kJn5o07g znIte5MdBYabbtEqHqH5" as="button" role="menuitem"' +
        ' aria-setsize="' + setsize + '" aria-posinset="1" tabindex="-1">' +
        '<div class="e-10860-legacy-box e-10860-legacy-list-row W_K5ReEy_bcS4W3lZquw"' +
          ' data-encore-id="listRow" role="group" aria-labelledby="listrow-title-new-playlist">' +
          '<div class="e-10860-legacy-list-row__header"><div class="e-10860-legacy-list-row__column e-10860-legacy-list-row__interactive">' +
            '<p class="e-10860-text encore-text-body-medium e-10860-legacy-list-row-title"' +
            ' data-encore-id="listRowTitle" id="listrow-title-new-playlist" aria-hidden="true">New playlist</p>' +
          '</div></div>' +
        '</div>' +
      '</button>' +
    '</li>' +
    '<hr data-encore-id="menuDivider" role="separator" class="e-10860-menu-divider">' +
    '<div data-overlayscrollbars-initialize="true" class="MXLZNxYnZTku_kjmH6CT" data-overlayscrollbars="host">' +
      '<div class="VJN7Cu7VWHMAJ4ghR2wg" data-overlayscrollbars-viewport="scrollbarHidden overflowXHidden overflowYScroll" tabindex="-1">' +
        '<div class="RqGU3Bco6eU_KHXAMKcc" role="presentation">';
  rows += rowHtml(LIKED_URI, "Liked Songs", "https://misc.scdn.co/liked-songs/liked-songs-64.png", 2, setsize);
  PLAYLISTS.forEach(function (p, i) {
    rows += rowHtml(p[0], p[1], p[2], i + 3, setsize);
  });
  rows +=
        '</div>' +
      '</div>' +
    '</div>';
  return (
    '<form class="y_CFKW8usK4BrguFZgGF">' +
      '<div class="yRKpY9ZGM2HiJSaUwNwS"><span class="e-10860-text encore-text-marginal-bold"' +
        ' data-encore-id="text">Add to playlist</span></div>' +
      '<div class="BrtO78Hq7fXUY0A0VcXX"><div class="PWxxd2O9XAbPUS3VyX3J tFf2FP5jXicj0UYsUNU6" role="search">' +
        '<input class="owRCnNd0XkXhLaGHk2A7" role="searchbox" maxlength="80" autocorrect="off"' +
          ' autocapitalize="off" spellcheck="false" placeholder="Find a playlist" aria-hidden="false"' +
          ' aria-label="Find a playlist" value="">' +
      '</div></div>' +
      '<ul tabindex="0" role="menu" data-depth="0" aria-label="Add to playlist menu"' +
        ' class="mWz9Rk7kHk7egR7hsAyt" id="curation-sheet-list" data-roving-interactive="1">' +
        rows +
      '</ul>' +
      '<div class="SKQ_ro1AL4NJXhi4LqKz">' +
        '<button type="button" class="e-10860-legacy-button" data-encore-id="buttonTertiary">Cancel</button>' +
        '<button type="button" class="e-10860-legacy-button" data-encore-id="buttonTertiary">Done</button>' +
      '</div>' +
    '</form>'
  );
}

/* ---------------- fake Spotify behaviour ---------------- */
var form = null;

function curationBtn() {
  return document.querySelector('footer button[data-encore-id="buttonTertiary"]');
}
function syncBtn() {
  var b = curationBtn();
  b.setAttribute("aria-checked", liked ? "true" : "false");
  b.setAttribute("aria-label", liked ? "Add to playlist" : "Add to Liked Songs");
  var sym = document.querySelector('button[data-testid="add-button"]');
  if (sym) sym.setAttribute("aria-checked", liked ? "true" : "false");
}
function uriOf(btn) {
  var box = btn.querySelector('[data-encore-id="listRow"]');
  return box ? (box.getAttribute("aria-labelledby") || "") : "";
}
function openForm() {
  if (form) return;
  document.body.insertAdjacentHTML("beforeend", buildFormHTML());
  form = document.querySelector("form");
  Array.prototype.forEach.call(form.querySelectorAll('button[role="menuitemcheckbox"]'), function (b) {
    // Staged only: flips the visual, does NOT touch membership.
    b.addEventListener("click", function (e) {
      e.preventDefault();
      var on = b.getAttribute("aria-checked") !== "true";
      b.setAttribute("aria-checked", on ? "true" : "false");
      out.push("      [spotify] staged " + uriOf(b) + " -> " + on);
    });
  });
  Array.prototype.forEach.call(form.querySelectorAll("button"), function (b) {
    if (b.textContent !== "Cancel" && b.textContent !== "Done") return;
    b.addEventListener("click", function (e) {
      e.preventDefault();
      if (b.textContent === "Done") {
        // saveChanges: every staged row commits to server truth.
        Array.prototype.forEach.call(
          form.querySelectorAll('button[role="menuitemcheckbox"]'),
          function (x) {
            var clean = uriOf(x).replace(/^listrow-title-/, "");
            var on = x.getAttribute("aria-checked") === "true";
            if (clean === LIKED_URI) liked = on;
            else membership[clean] = on;
          }
        );
      }
      // Cancel: staged visuals are discarded, membership untouched.
      out.push("      [spotify] " + b.textContent + " (liked=" + liked + ")");
      form.remove();
      form = null;
      syncBtn();
    });
  });
}
function closeFormHard() {
  if (form) { form.remove(); form = null; }
  syncBtn();
}
curationBtn().addEventListener("click", function () {
  if (form) return;                              // saved state -> opens the sheet
  if (!liked) { liked = true; syncBtn(); return; } // unsaved -> a real Like, no sheet
  openForm();
});
// A separate symmetric toggle in the widget: likes/unlikes directly.
document.querySelector('button[data-testid="add-button"]').addEventListener("click", function () {
  liked = !liked;
  out.push("      [spotify] symmetric toggle -> liked=" + liked);
  syncBtn();
});

/* ---------------- assertions ---------------- */
var out = [], fails = 0;
function ok(cond, msg) {
  if (!cond) fails++;
  out.push((cond ? "PASS  " : "FAIL  ") + msg);
}
function byId(list, id) {
  return (list || []).filter(function (p) { return p.id === id; })[0];
}
var TARGET = "1w4tj8rQmdzeNmV7JzCbeE";
function row(uri, name) {
  return { id: uri.replace("spotify:playlist:", ""), uri: uri, name: name };
}
function finish() {
  var pre = document.getElementById("out");
  pre.textContent = out.join("\n") + "\n\n" + (fails ? fails + " FAILED" : "ALL PASSED");
  document.title = fails ? "FAILED" : "DONE";
}

var sp = window.SpotMobile.spotify;
sp.getPlaylists({ fresh: true })
  .then(function (list) {
    out.push("--- read on an UNSAVED track: " + (list ? list.length : 0) + " rows ---");
    (list || []).forEach(function (p) {
      out.push("  " + (p.containsTrack ? "[x] " : "[ ] ") + JSON.stringify(p.id) + "  " + p.name +
               (p.artwork ? "  art" : "  NO-ART") + (p.isLikedSongs ? "  (liked)" : ""));
    });
    var EXPECTED = PLAYLISTS.length + 1;
    ok(!!list && list.length === EXPECTED, "returns all " + EXPECTED + " leaf rows (New playlist excluded)");
    ok(!!list && list[0] && list[0].isLikedSongs, "Liked Songs is first");
    ok(!!list && byId(list, TARGET) && byId(list, TARGET).name === "web swinging in nyc",
       "playlist id + name parsed from the inner listRow group");
    ok(!!list && byId(list, TARGET) && byId(list, TARGET).uri === "spotify:playlist:" + TARGET,
       "exact spotify: uri parsed");
    ok(!!list && byId(list, TARGET) && !!byId(list, TARGET).artwork, "artwork parsed");
    ok(!!list && list.every(function (p) { return !!(p.id || p.isLikedSongs); }),
       "every row carries a usable id (no half-parsed rows)");
    ok(!!list && list.every(function (p) { return p.isLikedSongs || p.href === "/playlist/" + p.id; }),
       "every row has a real href");
    ok(!!list && list.every(function (p) { return p.name && p.name.length; }), "every row has a name");
    ok(!!list && list.filter(function (p) { return !p.isLikedSongs; })
                     .every(function (p) { return p.containsTrack === false; }),
       "unchecked rows report containsTrack=false");
    ok(list[0].containsTrack === false, "transient read reports Liked=false");
    ok(liked === false, "no Like leaked by the transient dance");
    ok(sp.isLiked() === false, "isLiked() still false after the read");

    return sp.addToPlaylist(row("spotify:playlist:" + TARGET, "web swinging in nyc"));
  })
  .then(function (res) {
    ok(!!res && res.ok === true, "addToPlaylist succeeds against a real row");
    ok(!!res && res.list && byId(res.list, TARGET) && byId(res.list, TARGET).containsTrack === true,
       "addToPlaylist result reports the flipped row");
    ok(!!res && res.list && res.list.length === PLAYLISTS.length + 1, "still all rows after a real toggle");
    return sp.getPlaylists({ fresh: true });
  })
  .then(function (list) {
    ok(!!byId(list, TARGET) && byId(list, TARGET).containsTrack === true,
       "added row reads back as containsTrack (Done committed)");
    return sp.removeFromPlaylist(row("spotify:playlist:" + TARGET, "web swinging in nyc"));
  })
  .then(function (res) {
    ok(!!res && res.ok === true, "removeFromPlaylist succeeds against a real row");
    return sp.getPlaylists({ fresh: true });
  })
  .then(function (list) {
    ok(!!byId(list, TARGET) && byId(list, TARGET).containsTrack === false,
       "removed row reads back unchecked");
    ok(!!list && list.length === PLAYLISTS.length + 1, "still all rows after remove");
    ok(!!list && list[0] && list[0].containsTrack === false, "Liked untouched by playlist ops");

    // Bulk draft: check two at once, exactly like our sheet's Done does.
    var a = PLAYLISTS[2][0], b = PLAYLISTS[3][0];
    closeFormHard();
    return sp.savePlaylistDraft([
      { uri: a, id: a.replace("spotify:playlist:", ""), name: PLAYLISTS[2][1], want: true },
      { uri: b, id: b.replace("spotify:playlist:", ""), name: PLAYLISTS[3][1], want: true },
    ]).then(function (r) {
      ok(!!r && r.ok === true, "savePlaylistDraft commits a multi-playlist draft");
      ok(!r.failed || !r.failed.length, "savePlaylistDraft reports no failures");
      return sp.getPlaylists({ fresh: true });
    });
  })
  .then(function (list) {
    ok(!!byId(list, PLAYLISTS[2][0].replace("spotify:playlist:", "")) &&
          byId(list, PLAYLISTS[2][0].replace("spotify:playlist:", "")).containsTrack === true,
       "drafted row 1 committed");
    ok(!!byId(list, PLAYLISTS[3][0].replace("spotify:playlist:", "")) &&
          byId(list, PLAYLISTS[3][0].replace("spotify:playlist:", "")).containsTrack === true,
       "drafted row 2 committed");
    ok(liked === false, "bulk draft left the real Like alone");

    // An already-liked track: one click must open the sheet with no dance.
    liked = true;
    membership[PLAYLISTS[1][0]] = true;
    syncBtn();
    return sp.getPlaylists({ fresh: true });
  })
  .then(function (list) {
    var likedRow = list[0];
    var marked = byId(list, PLAYLISTS[1][0].replace("spotify:playlist:", ""));
    ok(!!likedRow && likedRow.containsTrack === true, "saved track: Liked row reports containsTrack");
    ok(!!marked && marked.containsTrack === true, "saved track: pre-checked playlist row preserved");
    ok(!!list && list.length === PLAYLISTS.length + 1, "saved track: full list");
    ok(liked === true, "saved track: no Like churn from the read");
  })
  .then(finish, function (e) {
    out.push("THREW: " + ((e && e.stack) || e));
    fails++;
    finish();
  });
</script>
</body>
</html>
